[folders]
lineaje_folder = inputs/linajes/
parameter_file_folder = cfg/params/master_fields.csv
output_folder = outputs
dmstask_output_folder = ${folders:output_folder}/dmstask
government_output_folder = ${folders:output_folder}/government
dataquality_output_folder = ${folders:output_folder}/dataquality
parameter_output_folder = ${folders:output_folder}/parameters

[logging]
level = INFO

[dmstask]
#activar/desactivar la generación de dmstask
active = True 

[government]
#activar/desactivar la generación de las tablas de gobierno
active = True

[dataquality]
# activar/desactivar la generación de los ficheros de reglas para DQ
active = True
# parametro para añadir o no los campos faltantes en el linaje
is_complete = True
# entornos disponibles
environments = des,val,pro
# athena database
database = md_aw_we_environment_gl_da_db_stg_cudc
# ruleset name
dq_ruleset_name_prefix = ruleset_01_stg

[parameters]
active = True
environment = des

# json tables config
table_config_file = cfg/params/table_parameters.json
validations_file = cfg/params/validations.json

# Campos parametria valor fijo
s3_prefix = data
db_name = MDM
carga_incremental = True
db_name_cargas = cudc_operativa
ruleset_name_prefix = ${dataquality:dq_ruleset_name_prefix}
mdm_dbname = MDM
mdm_uniqueid_table = CUDC_MODD_MDM_XREF_EXT_HSU
mdm_uniqueid_column = ID_CIUDADANO_GR
mdm_originid_column = ID_CIUDADANO_SRC
mdm_sourceid_column = CD_SRC
dynamoDB_table_prefix = hsta_ruu_ruus

# Campos para validaciones
fecha_modificacion = FC_ULTIMA_ACT
fecha_incremental = FC_ULTIMA_ACT
fecha_incremental_mdm = FC_ULTIMA_ACT